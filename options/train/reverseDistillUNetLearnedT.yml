# ------------------------------------------------------------------------
# Learned-t reverse distillation with a 999 -> 850 DDIM online target step.
# ------------------------------------------------------------------------
name: ReverseDistillUNetLearnedT
model_type: ReverseDistillLearnedTModel
scale: 1
cfg_sacle: 7.5
num_gpu: 1
manual_seed: 10

# These fields are optional in ReverseDistillLearnedTModel.
use_pred_xstart_prompt: true
use_sd_inference: true
prepare_online_batch: true
learned_timestep_init: 850.0
online_source_timestep: 999
online_target_timestep: 850
sd_model_id: sd-legacy/stable-diffusion-v1-5

datasets:
  train:
    name: ReverseDistillFeatures
    type: ReverseDistillFeatureDataset
    dataroot_gt: ./gen_img_val_v15_coco2014_unipc_low/noise_gt.lmdb
    dataroot_cond_xstart: ./gen_img_val_v15_coco2014_unipc_low/cond_xstart.lmdb
    dataroot_uncond_xstart: ./gen_img_val_v15_coco2014_unipc_low/uncond_xstart.lmdb
    dataroot_final_latents: ./gen_img_val_v15_coco2014_unipc_low/final_latents.lmdb
    dataroot_prompt: ./gen_img_val_v15_coco2014_unipc_low/prompt.lmdb
    use_embed: true
    filename_tmpl: '{}'
    io_backend:
      type: lmdb
    gt_size: 64
    use_flip: false
    use_rot: false
    num_worker_per_gpu: 1
    batch_size_per_gpu: 2
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_xstart:
  type: ReversePromptNAFNet
  img_channel: 4
  width: 64
  enc_blk_nums: [5, 5]
  middle_blk_num: 12
  dec_blk_nums: [5, 5]
  prompt_channel_width: 768

network_xt:
  type: ReversePromptNAFNet
  img_channel: 4
  width: 64
  enc_blk_nums: [5, 5]
  middle_blk_num: 12
  dec_blk_nums: [5, 5]
  prompt_channel_width: 768

path:
  pretrain_network_xstart: ~
  pretrain_network_xt: ~
  pretrain_network_xstart_ema: ~
  pretrain_network_xt_ema: ~
  strict_load_g: false
  resume_state: ~

train:
  optim_xstart:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  optim_xt:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 80000
    eta_min: !!float 1e-7
  total_iter: 80000
  warmup_iter: -1
  ema_decay: 0.95
  xstart_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  xstart_loss_weight: 1.0
  xt_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  xt_loss_weight: 1.0
  xT_loss_weight: 1.0

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~