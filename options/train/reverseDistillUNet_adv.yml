# ------------------------------------------------------------------------
# Reverse distillation with FARI-style latent input perturbations
# ------------------------------------------------------------------------
name: ReverseDistillUNetAdv
model_type: ReverseDistillModel
scale: 1
cfg_sacle: 1.2
alpha_cumprod_method: linear_alpha
timestep_head_type: classifier
num_gpu: 1
manual_seed: 10
use_pred_xstart_prompt: true
use_prompt_emb: false

# Recreate a temporary, on-disk cache of a deterministic latent subset before
# training. Uncached samples retain their original final_latents.
use_adv_training: true
adv_latent_cache_fraction: 0.5
adv_latent_cache_batch_size: 4
adv_distortion:
  jpeg_ratio: 25
  random_crop_ratio: 0.6
  random_drop_ratio: 0.8
  gaussian_blur_r: 4
  median_blur_k: 7
  gaussian_std: 0.05
  sp_prob: 0.05
  brightness_factor: 6
  resize_ratio: 0.25

datasets:
  train:
    name: ReverseDistillFeatures
    type: ReverseDistillFeatureDataset
    dataroot_gt: ./gen_img_val_v15_coco2014_unipc_low/noise_gt.lmdb
    dataroot_cond_xstart: ./gen_img_val_v15_coco2014_unipc_low/cond_xstart_1.lmdb
    dataroot_uncond_xstart: ./gen_img_val_v15_coco2014_unipc_low/uncond_xstart_1.lmdb
    dataroot_final_latents: ./gen_img_val_v15_coco2014_unipc_low/final_latents.lmdb
    dataroot_prompt: ./gen_img_val_v15_coco2014_unipc_low/prompt.lmdb
    use_embed: true
    filename_tmpl: '{}'
    io_backend:
      type: lmdb

    gt_size: 64
    use_flip: false
    use_rot: false

    num_worker_per_gpu: 1
    # One cached perturbation and one original latent are sampled per batch.
    batch_size_per_gpu: 6
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

network_xstart:
  type: NAFNet
  img_channel: 4
  width: 64
  enc_blk_nums: [5, 5]
  middle_blk_num: 12
  dec_blk_nums: [5, 5]
  prompt_channel_width: 768

network_xt:
  type: NAFNet
  img_channel: 4
  width: 64
  enc_blk_nums: [10, 10]
  middle_blk_num: 24
  dec_blk_nums: [10, 10]
  prompt_channel_width: 768

path:
  pretrain_network_xstart: ~
  pretrain_network_xt: ~
  pretrain_network_xstart_ema: ~
  pretrain_network_xt_ema: ~
  strict_load_g: false
  resume_state: ~

train:
  optim_xstart:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]
  optim_xt:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: 0.
    betas: [0.9, 0.9]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 80000
    eta_min: !!float 1e-7

  total_iter: 80000
  warmup_iter: -1
  ema_decay: 0.95

  xstart_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  xstart_loss_weight: 1.0
  xt_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean
  xt_loss_weight: 1.0
  timestep_loss_weight: 0.0
  timestep_regression_loss_weight: 1.0

logger:
  print_freq: 100
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~
